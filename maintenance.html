<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>S21+ Home Server — Em desenvolvimento</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background:
        linear-gradient(rgba(0, 255, 170, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 170, 0.025) 1px, transparent 1px),
        #07110f;

      background-size: 32px 32px;

      color: #d7fff2;

      font-family:
        "Courier New",
        monospace;

      overflow: hidden;
    }

    .terminal {
      position: relative;

      width: min(760px, 100%);

      padding: 32px;

      border: 1px solid rgba(0, 255, 170, 0.35);
      border-radius: 8px;

      background: rgba(4, 18, 15, 0.92);

      box-shadow:
        0 0 30px rgba(0, 255, 170, 0.08),
        inset 0 0 30px rgba(0, 255, 170, 0.025);
    }

    .terminal::before {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(255, 255, 255, 0.018) 4px
      );
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 42px;

      font-size: 0.78rem;
      letter-spacing: 1px;

      color: #67e8c2;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #39ff9c;

      box-shadow: 0 0 10px #39ff9c;

      animation: pulse 1.4s infinite;
    }

    h1 {
      margin-bottom: 12px;

      font-size: clamp(2rem, 7vw, 4.5rem);
      line-height: 0.95;

      letter-spacing: -3px;

      color: #ecfff9;
    }

    .subtitle {
      margin-bottom: 36px;

      color: #67e8c2;

      font-size: 0.9rem;
      letter-spacing: 2px;
    }

    .progress {
      height: 4px;

      margin-bottom: 35px;

      overflow: hidden;

      background: rgba(103, 232, 194, 0.1);
    }

    .progress-bar {
      width: 35%;
      height: 100%;

      background: #39ff9c;

      box-shadow: 0 0 12px rgba(57, 255, 156, 0.6);

      animation: loading 2.2s ease-in-out infinite;
    }

    .log {
      min-height: 110px;

      font-size: 0.86rem;
      line-height: 1.9;

      color: #8aa89f;
    }

    .log strong {
      color: #39ff9c;
      font-weight: normal;
    }

    .cursor {
      display: inline-block;

      color: #39ff9c;

      animation: blink 0.7s steps(1) infinite;
    }

    .footer {
      margin-top: 35px;
      padding-top: 16px;

      border-top: 1px solid rgba(103, 232, 194, 0.12);

      font-size: 0.7rem;
      letter-spacing: 1px;

      color: #527168;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.35;
        transform: scale(1.5);
      }
    }

    @keyframes loading {
      from {
        transform: translateX(-110%);
      }

      to {
        transform: translateX(300%);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .terminal {
        padding: 22px;
      }

      .top {
        margin-bottom: 32px;
      }

      h1 {
        letter-spacing: -2px;
      }
    }
  </style>
</head>

<body>

  <main class="terminal">

    <div class="top">
      <span>S21+ HOME SERVER</span>

      <span class="online">
        <span class="dot"></span>
        ONLINE
      </span>
    </div>
<div class="pixel-scene" aria-hidden="true">

  <div class="pixel-server">
    <div class="server-slot">
      <span class="pixel-led"></span>
      <span class="pixel-line"></span>
    </div>

    <div class="server-slot">
      <span class="pixel-led"></span>
      <span class="pixel-line"></span>
    </div>

    <div class="server-slot">
      <span class="pixel-led"></span>
      <span class="pixel-line"></span>
    </div>
  </div>

  <div class="pixel-signal">
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>
    <h1>SYSTEM<br>BOOTING...</h1>

    <div class="subtitle">
      SITE EM DESENVOLVIMENTO
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <div class="log">
      <div><strong>&gt;</strong> servidor S21 ativo</div>
      <div><strong>&gt;</strong> serviços essenciais carregados</div>

      <div>
        <strong>&gt;</strong>
        <span id="message">construindo nova interface...</span>
        <span class="cursor">_</span>
      </div>
    </div>

    <div class="footer">
      MAINTENANCE MODE // S21 HOMELAB
    </div>

  </main>

  <script>
    const messages = [
      "construindo nova interface...",
      "configurando serviços...",
      "testando componentes...",
      "implementando automações...",
      "monitorando infraestrutura...",
      "preparando próxima versão..."
    ];

    const message = document.getElementById("message");

    let index = 0;

    setInterval(() => {
      index = (index + 1) % messages.length;
      message.textContent = messages[index];
    }, 2200);
  </script>

</body>

</html>
