<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página em Manutenção</title>
    <style>
        /* Reset e estilo de fundo */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a24; /* Fundo noturno escuro */
            color: #d8d8d8;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container principal */
        #maintenance-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Canvas com borda sutil simulando uma tela */
        canvas {
            background-color: #14141d;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            image-rendering: pixelated; /* Mantém o aspecto retro do canvas */
            max-width: 100%;
        }

        /* Estilo da legenda */
        .caption {
            font-size: 1.1rem;
            text-align: center;
            color: #888;
            letter-spacing: 1px;
        }

        /* Efeito de cursor piscando no final do texto */
        .caption::after {
            content: '█';
            display: inline-block;
            margin-left: 5px;
            color: #555;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="maintenance-box">
        <canvas id="catCanvas" width="500" height="250"></canvas>
        <p class="caption">esta pagina ainda não está pronta, o desenvolvedor está dormindo</p>
    </div>

    <script>
        const canvas = document.getElementById('catCanvas');
        const ctx = canvas.getContext('2d');
        
        // Tamanho de cada "pixel" do nosso desenho
        const PIXEL_SIZE = 8;
        
        // Posição inicial do gato (fora da tela à esquerda)
        let catX = -150; 
        const catY = 120; // Posição vertical fixa
        
        let frameCount = 0;
        let isSleeping = false;
        let zzzParticles = []; // Array para guardar as partículas de sono

        // Mapeamento de cores do Sprite
        // ' ' = transparente, '#' = pelo preto, 'Y' = olho aberto, 'P' = focinho, '-' = olho fechado
        const colorMap = {
            '#': '#0f0f0f',
            'Y': '#ffcc00',
            'P': '#ff7777',
            '-': '#333333'
        };

        // Matrizes desenhando o gato quadro a quadro (16x11)
        const sprites = {
            walk1: [
                "           #  # ",
                "           ## ##",
                "           #####",
                "     ###########",
                "   #########Y#Y#",
                "  ##############",
                "  ##########P## ",
                "   ###########  ",
                "    ##     ##   ",
                "    ##     ##   ",
                "    #      #    "
            ],
            walk2: [
                "           #  # ",
                "           ## ##",
                "           #####",
                "     ###########",
                "   #########Y#Y#",
                "  ##############",
                "  ##########P## ",
                "   ###########  ",
                "     ##     ##  ",
                "    ##     ##   ",
                "    ##     ##   "
            ],
            sleep: [
                "                ",
                "                ",
                "                ",
                "                ",
                "                ",
                "           #  # ",
                "          ######",
                "    #######-##-#",
                "   #########P## ",
                "  ############  ",
                "  ###########   "
            ]
        };

        // Função para desenhar a matriz de texto no Canvas
        function drawSprite(spriteArray, x, y) {
            for (let row = 0; row < spriteArray.length; row++) {
                for (let col = 0; col < spriteArray[row].length; col++) {
                    const char = spriteArray[row][col];
                    if (char !== ' ') {
                        ctx.fillStyle = colorMap[char];
                        ctx.fillRect(
                            x + (col * PIXEL_SIZE), 
                            y + (row * PIXEL_SIZE), 
                            PIXEL_SIZE, 
                            PIXEL_SIZE
                        );
                    }
                }
            }
        }

        // Loop principal de animação
        function animate() {
            // Limpa o canvas a cada frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenha a linha do chão
            ctx.fillStyle = '#222';
            ctx.fillRect(0, catY + (11 * PIXEL_SIZE), canvas.width, 2);

            if (!isSleeping) {
                // Lógica de caminhada
                catX += 1.5; // Velocidade do gato
                
                // Se chegou no meio da tela, vai dormir
                if (catX >= (canvas.width / 2) - ((16 * PIXEL_SIZE) / 2)) {
                    isSleeping = true;
                }

                // Alterna entre o passo 1 e passo 2 a cada 10 frames
                const currentFrame = Math.floor(frameCount / 10) % 2 === 0 ? sprites.walk1 : sprites.walk2;
                drawSprite(currentFrame, catX, catY);
                
            } else {
                // Lógica de dormir
                drawSprite(sprites.sleep, catX, catY);

                // Cria uma nova letra "Z" a cada 60 frames
                if (frameCount % 60 === 0) {
                    zzzParticles.push({
                        x: catX + 90, // Posição saindo da cabeça do gato
                        y: catY + 20,
                        opacity: 1
                    });
                }

                // Atualiza e desenha as partículas "Zzz"
                for (let i = zzzParticles.length - 1; i >= 0; i--) {
                    let z = zzzParticles[i];
                    ctx.fillStyle = `rgba(150, 150, 150, ${z.opacity})`;
                    ctx.font = 'bold 20px "Courier New"';
                    ctx.fillText('Z', z.x, z.y);
                    
                    // Movimento do Z (sobe e faz curva senoidal leve)
                    z.y -= 0.6;
                    z.x += Math.sin(z.y / 10) * 0.5; 
                    z.opacity -= 0.008; // Vai sumindo aos poucos

                    // Remove do array quando fica invisível para economizar memória
                    if (z.opacity <= 0) {
                        zzzParticles.splice(i, 1);
                    }
                }
            }

            frameCount++;
            requestAnimationFrame(animate);
        }

        // Inicia a animação
        animate();
    </script>
</body>
</html>
